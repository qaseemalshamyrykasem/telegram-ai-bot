services:
  - type: web
    name: telegram-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_MODE
        value: polling
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
